spec_version: 1
name: reviewer-a
description: "Independent critique of the spec, grounded in source."
executor:
  type: omnigent
  config:
    harness: opencode-native
    # Distinct from spec-author (opus-4.8) and reviewer-b (gpt-5.5) so the author-adjudicated review
    # (SPEC-035) keeps three pairwise-distinct models — the author never shares a reviewer's model.
    model: github-copilot/claude-sonnet-4.5
    auth:
      profile: opencode-local
instructions: AGENTS.md
interaction:
  conversational: true
  mode: subagent
permission:
  read: allow
  edit: deny
  bash: deny
