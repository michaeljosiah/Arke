spec_version: 1
name: implementer
description: "Executes the Tasks; writes code on the feature branch."
executor:
  type: omnigent
  config:
    harness: opencode-native
    model: github-copilot/gpt-5.5
    options:
      reasoningEffort: xhigh
    auth:
      profile: opencode-local
instructions: AGENTS.md
interaction:
  conversational: true
  mode: subagent
permission:
  read: allow
  edit: allow
  bash: ask
  webfetch: deny
